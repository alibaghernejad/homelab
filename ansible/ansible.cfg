[defaults]
inventory = inventories/inventory.ini
host_key_checking = False
retry_files_enabled = False
timeout = 10
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
; become_user = ansible


[ssh_connection]
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
control_persist = 60s
control_master = auto
pipelining = true

