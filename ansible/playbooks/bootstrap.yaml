- name: Bootstrap Playbook
  hosts: homelabnodes
  gather_facts: no

  tasks:
  # - name: ping the host
  #   ansible.builtin.ping:

  # - name: Print the Message
  #   ansible.builtin.debug:
  #     msg: Hello World


  - name: Ensure MicroK8s is installed
    ansible.builtin.command:
      cmd: snap install microk8s --classic
      creates: /snap/bin/microk8s

  - name: Check the status while Kubernetes starts
    ansible.builtin.command:
      cmd: microk8s status --wait-ready
  
  - name: Turn on the services you want
    ansible.builtin.command:
      cmd: microk8s enable dashboard
